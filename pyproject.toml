[project]
name = "metadata-extract"
version = "0.3.6"
description = "A script to extract metadata from EO products"
authors = [
    {name = "Christoph Reck", email="christoph.reck@dlr.de"},
    {name = "Jonas Eberle", email="jonas.eberle@dlr.de"},
    {name = "Felix Feckler", email="felix.feckler@dlr.de"},
    {name = "Julian Meyer-Arnek", email="julian.meyer-arnek@dlr.de",
     name = "Katharina Emde", email="katharina.emde@dlr.de"}
]
license = {file = "LICENSE.md"}
readme = "README.md"
requires-python = ">=3.6"
keywords = [
    "metadata",
    "extraction",
    "opensearch eo",
    "stac",
    "sentinel"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "lxml",
    "cssselect",
    "jinja2",
    "gdal",
    "netCDF4",
    "dicttoxml"
]

[project.urls]
homepage = "https://github.com/dlr-eoc/EOmetadataTool"
documentation = "https://github.com/dlr-eoc/EOmetadataTool"
repository = "https://github.com/dlr-eoc/EOmetadataTool"
issues = "https://github.com/dlr-eoc/EOmetadataTool/issues"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"
